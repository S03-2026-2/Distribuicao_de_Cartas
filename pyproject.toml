[project]
name = "cartas"
version = "0.1.0"
description = "Card distribution service"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "jsonschema[format]>=4.23.0,<5.0.0",
    "referencing>=0.35.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
